<hgroup>
    <h1>{{title}}</h1>
    <action-menu>
        <option method="DELETE" action="/api/v1/integrations/{{name}}/reset">Reset</option>
    </action-menu>
</hgroup>
<label>Receive Endpoint</label>
<copy-span value="{{receiveEndpoint}}"></copy-span>
<form-request method="POST" action="/api/v1/integrations/{{name}}/update">
    <ul class="list-panel">
        <li>
            <label>Application ID</label>
            <input name="application_id" value="{{config.application_id}}">
        </li>
        <li>
            <label>Public Key</label>
            <input name="public_key" value="{{config.public_key}}"></input>
        </li>
        <li>
            <label>Bot Private Key</label>
            <input-password name="bot_private_key" value="{{config.bot_private_key}}"></input-password>
        </li>
    </ul>
</form-request>
